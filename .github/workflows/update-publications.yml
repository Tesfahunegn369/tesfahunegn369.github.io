name: Update publications

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Weekly on Monday at 05:17 UTC

permissions:
  contents: write

concurrency:
  group: update-publications
  cancel-in-progress: false

jobs:
  refresh-publications:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publication updater dependencies
        run: python -m pip install --upgrade pip requests scholarly
      - name: Fetch publication metadata
        run: python scripts/update_publications.py
      - name: Commit updated publication data
        run: |
          if git diff --quiet -- publications.json; then
            echo "No publication changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "chore: refresh publications"
          git pull --rebase --autostash
          git push
